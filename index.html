<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>He Kong | AI Researcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 新增样式部分 */
    .hero {
      display: flex;
      align-items: center;
      padding: 60px 10%;
      background: linear-gradient(to right, #003973, #e5e5be);
    }

    .profile-container {
      display: flex;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .profile-image {
      width: 200px;
      height: 200px;
      border: 4px solid white;
      margin-right: 50px;
      flex-shrink: 0;
    }

    .profile-text {
      color: white;
      text-align: left;
    }

    @media (max-width: 768px) {
      .profile-container {
        flex-direction: column;
        text-align: center;
      }
      
      .profile-image {
        margin-right: 0;
        margin-bottom: 30px;
      }
      
      .profile-text {
        text-align: center;
      }
    }

    /* 原有其他样式保持不变 */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #f0f4f8, #ffffff);
      color: #222;
    }

    /* 修改原有.hero样式 */
    .hero {
      background: linear-gradient(to right, #003973, #e5e5be);
      color: white;
      padding: 60px 20px;
    }

    /* 其他原有样式保持不变... */
  </style>
</head>
<body>

  <div class="hero">
    <div class="profile-container">
      <img src="HeKong.jpg" alt="He Kong" class="profile-image">
      <div class="profile-text">
        <h1>He Kong</h1>
        <p>Ph.D. Candidate in Artificial Intelligence · Jilin University</p>
      </div>
    </div>
  </div>

  <!-- 其他内容保持不变 -->
  <div class="container">
    <!-- 原有内容保持不变... -->
  </div>

</body>
</html>
